name: Firmware build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Rev A Heltec pin map
        run: python tests/rev_a_pinmap_test.py

      - name: Run FPort 85 codec tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/fport85_codec_test.cpp -o /tmp/fport85_codec_test
          /tmp/fport85_codec_test

      - name: Run FPort 85 Modbus uplink tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/fport85_modbus_uplink_test.cpp -o /tmp/fport85_modbus_uplink_test
          /tmp/fport85_modbus_uplink_test

      - name: Run FPort 85 report scheduler tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/fport85_report_scheduler_test.cpp -o /tmp/fport85_report_scheduler_test
          /tmp/fport85_report_scheduler_test

      - name: Run FPort 85 history tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/fport85_history_test.cpp -o /tmp/fport85_history_test
          /tmp/fport85_history_test

      - name: Run persistent history image tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/history_image_codec_test.cpp -o /tmp/history_image_codec_test
          /tmp/history_image_codec_test

      - name: Run Modbus RTU codec tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/modbus_rtu_codec_test.cpp -o /tmp/modbus_rtu_codec_test
          /tmp/modbus_rtu_codec_test

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Prepare firmware artifact
        run: |
          mkdir -p dist
          cp .pio/build/heltec-v4/firmware.bin dist/firmware.bin
          sha256sum dist/firmware.bin > dist/firmware.bin.sha256

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: multibus-firmware-${{ github.sha }}
          path: |
            dist/firmware.bin
            dist/firmware.bin.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged firmware release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/firmware.bin "dist/multibus-${GITHUB_REF_NAME}.bin"
          sha256sum "dist/multibus-${GITHUB_REF_NAME}.bin" > "dist/multibus-${GITHUB_REF_NAME}.bin.sha256"

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

          gh release upload "$GITHUB_REF_NAME" \
            "dist/multibus-${GITHUB_REF_NAME}.bin" \
            "dist/multibus-${GITHUB_REF_NAME}.bin.sha256" \
            --clobber
