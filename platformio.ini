[env:heltec-v4]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D MULTIBUS_BOARD_HELTEC_V4_2=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; PlatformIO currently has no native Heltec WiFi LoRa 32 V4 board manifest.
; The ESP32-S3 manifest is used as the compiler/upload baseline while all
; V4.2 board resources are defined explicitly in include/board/BoardPins.h.
